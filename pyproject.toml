[project]
name = "mayzerock-tender-system"
version = "0.1.0"
description = "AI Tender Analysis & Bid Drafting Agent"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "moto>=5.0",
    "boto3-stubs[s3,dynamodb,textract,bedrock-runtime,bedrock-agent-runtime,ses,stepfunctions]",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
